apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: inventory-api
  namespace: argocd

  finalizers:
    - resources-finalizer.argocd.argoproj.io

  annotations:
    argocd-image-updater.argoproj.io/image-list: inventory=acrinventory123.azurecr.io/inventory-api
    argocd-image-updater.argoproj.io/inventory.update-strategy: newest-build
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main

spec:
  project: default

  source:
    repoURL: https://github.com/afiat47/cloud-inventory-system.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: inventory

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true

    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
